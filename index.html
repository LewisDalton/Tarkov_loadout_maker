<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarkov Loadout Creator</title>
    <link rel="icon" href="assets/images/bullet_favicon.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="title">Tarkov Loadout Creator</h1>
    <section id="character">
      <div class="layer">
        <div id="Headphones" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt=""
          />
          <select>
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
        <div id="Headwear" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt=""
          />
          <select id="helmet_select">
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
        <div id="Face Cover" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt=""
          />
          <select>
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
      </div>
      <div class="layer">
        <div id="Arm Band" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt="item-placeholder"
          />
          <select>
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
        <div id="Armor" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt=""
          />
          <select>
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
        <div id="Vis. observ. device" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt="item-placeholder"
          />
          <select>
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
      </div>
      <div class="layer">
        <div id="gun1" class="rec_container">
          <img
            class="label-tarkov"
            class="gun_label"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image rec_img"
            src="assets/images/item-placeholder-wide.jpg"
            alt=""
          />
          <select class="gun_select">
            <option value="assets/images/item-placeholder-wide.jpg">
              None
            </option>
          </select>
        </div>
        <div id="Handgun" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt=""
          />
          <select>
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
      </div>
      <div class="layer">
        <div id="gun2" class="rec_container">
          <img
            class="label-tarkov"
            class="gun_label"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image rec_img"
            src="assets/images/item-placeholder-wide.jpg"
            alt=""
          />
          <select class="gun_select">
            <option value="assets/images/item-placeholder-wide.jpg">
              None
            </option>
          </select>
        </div>
        <div id="Knife" class="square_container">
          <img
            class="label-tarkov"
            src="assets/images/label-tarkov.png"
            alt=""
          />
          <img
            class="item_image square_img"
            src="assets/images/item-placeholder.jpg"
            alt=""
          />
          <select>
            <option value="assets/images/item-placeholder.jpg">None</option>
          </select>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
